<!doctype html>

<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080d18">
<title>WaiNet VPN</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d18;color:#eef5ff;font-family:Arial,sans-serif}
header{padding:22px 20px;border-bottom:1px solid #1c3150}
.logo{color:#42a5ff;font-size:27px;font-weight:bold}
.logo span{color:white}
main{max-width:480px;margin:auto;padding:25px 20px}
.tag{color:#49a8ff;font-size:12px;letter-spacing:2px}
h1{font-size:30px;margin:12px 0}
p{color:#a9b9d0;line-height:1.8}
.panel{background:#101b2d;border:1px solid #243c5d;border-radius:20px;padding:24px;margin-top:25px;text-align:center}
.circle{width:100px;height:100px;border:3px solid #168aff;border-radius:50%;margin:10px auto 20px;display:grid;place-items:center;color:#4baaff;font-size:38px}
button{width:100%;padding:16px;border:0;border-radius:12px;background:#168aff;color:white;font-size:18px;font-weight:bold}
.status{color:#63b6ff;margin:15px 0}
.note{font-size:13px;margin-top:24px}
</style>
</head>
<body>
<header><div class="logo">WaiNet <span>VPN</span></div></header>
<main>
<div class="tag">SECURE CONNECTION</div>
<h1>သင့်အင်တာနက်၊ ပိုမိုလုံခြုံစွာ</h1>
<p>WaiNet VPN မှ ကြိုဆိုပါတယ်။ သင့် VPN ချိတ်ဆက်မှုအခြေအနေကို ဒီနေရာမှာ ကြည့်နိုင်ပါတယ်။</p>
<div class="panel">
<div class="circle">↗</div>
<div id="status" class="status">Demo အခြေအနေ — မချိတ်ဆက်ရသေးပါ</div>
<button onclick="document.getElementById('status').textContent='Demo သာဖြစ်သည် — VPN Server မချိတ်ဆက်ရသေးပါ'">ချိတ်ဆက်ရန် (Demo)</button>
<p class="note">ဤခလုတ်သည် Demo သာဖြစ်သည်။ တကယ့် VPN အသုံးပြုရန် VPN Server ချိတ်ဆက်မှု လိုအပ်ပါသည်။</p>
</div>
</main>
</body>
</html>
